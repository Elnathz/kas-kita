      .bg { fill: #ffffff; }
      .qris-header { fill: #ea232a; }
      .text-dark { fill: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
      .text-muted { fill: #64748b; font-family: system-ui, -apple-system, sans-serif; }
      .qr-pixel { fill: #000000; }
    </style>
  </defs>
  
  <!-- Background Card -->
  <rect class="bg" width="300" height="380" rx="16" stroke="#e2e8f0" stroke-width="2" />
  
